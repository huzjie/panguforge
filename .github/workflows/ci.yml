name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Doctor
        run: python -m panguforge doctor --config config.example.yaml
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Smoke (pretrain)
        run: python -m panguforge pretrain --config examples/config_pretrain.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t panguforge:ci .
