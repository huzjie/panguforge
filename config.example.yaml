# panguforge 配置示例（复制为 config.yaml 后填写）
model:
  vocab_size: 512
  dim: 64
  num_heads: 4
  num_layers: 2
  moe_hidden: 256
  num_experts: 8
  top_k: 2
  max_seq: 512
  seed: 0

backend: mock            # mock | cpu | ascend | openai | vllm | transformers

mock:
  skill_init: 0.4        # 初始 skill（训练会单调提升到 ~1.0）
  lr: 0.05

train:
  steps: 100

rl:
  algorithm: grpo        # grpo | ppo
  steps: 40

serving:
  host: 127.0.0.1
  port: 8000

log_every: 20
